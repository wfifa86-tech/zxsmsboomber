<!DOCTYPE html>
<html lang="bn">
<head>
    <meta name="monetag" content="c34fe508e6b4efcc4765139c7ec2e704">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>zx SMS BOMBER</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #03050b);
            font-family: 'Inter', 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ---------- অনিমেটেড ব্যাকগ্রাউন্ড (গেমিং ভাইব) ---------- */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .cyber-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            transform: rotate(5deg);
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0) rotate(5deg); }
            100% { transform: translate(50px, 50px) rotate(5deg); }
        }

        .glowing-orbs {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.4;
            animation: floatOrb 15s infinite alternate ease-in-out;
        }

        .orb1 { width: 300px; height: 300px; background: #ff00cc; top: -100px; left: -100px; animation-duration: 18s; }
        .orb2 { width: 400px; height: 400px; background: #00ffff; bottom: -150px; right: -100px; animation-duration: 22s; animation-delay: 2s; }
        .orb3 { width: 250px; height: 250px; background: #ff6600; top: 50%; left: 70%; animation-duration: 25s; opacity: 0.3; }
        .orb4 { width: 350px; height: 350px; background: #3a0ca3; bottom: 20%; left: -10%; animation-duration: 20s; filter: blur(90px); }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 60px) scale(1.2); }
        }

        .pulse-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, cyan, magenta, cyan);
            animation: linePulse 3s infinite;
        }

        @keyframes linePulse {
            0% { opacity: 0.3; width: 0%; left: 0%; }
            50% { opacity: 1; width: 100%; left: 0%; }
            100% { opacity: 0.3; width: 0%; left: 100%; }
        }

        /* ---------- মূল কার্ড - গেমিং স্টাইল ---------- */
        .game-card {
            position: relative;
            z-index: 10;
            background: rgba(10, 20, 30, 0.75);
            backdrop-filter: blur(14px);
            border-radius: 36px;
            border: 1px solid rgba(0, 255, 255, 0.4);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 255, 255, 0.2), inset 0 1px 0 rgba(255,255,255,0.1);
            width: 100%;
            max-width: 540px;
            transition: all 0.3s;
        }

        .card-inner {
            padding: 32px 28px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .icon-badge {
            background: linear-gradient(135deg, #ff00cc, #00ffff);
            width: 80px;
            height: 80px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            animation: iconGlow 2s infinite alternate;
        }
        @keyframes iconGlow {
            0% { box-shadow: 0 0 10px cyan, 0 0 20px magenta; }
            100% { box-shadow: 0 0 25px magenta, 0 0 35px cyan; }
        }
        .icon-badge i {
            font-size: 42px;
            color: white;
        }
        h1 {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(125deg, #00ffff, #ff00cc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .sub {
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(0, 255, 255, 0.2);
            display: inline-block;
            padding: 5px 16px;
            border-radius: 40px;
            color: #0ff;
            border: 0.5px solid cyan;
            margin-top: 12px;
        }

        .input-group {
            margin-bottom: 24px;
            text-align: left;
        }
        .input-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: #bbffff;
            margin-bottom: 10px;
            font-family: 'Orbitron', monospace;
        }
        input {
            width: 100%;
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.65);
            border: 1.5px solid #2c5f7a;
            border-radius: 28px;
            color: #0ff;
            outline: none;
        }
        input:focus {
            border-color: #ff00cc;
            box-shadow: 0 0 15px rgba(255, 0, 204, 0.5);
        }

        .btn-send {
            background: linear-gradient(95deg, #ff00cc, #00ffff);
            border: none;
            padding: 16px 20px;
            width: 100%;
            border-radius: 60px;
            font-weight: 800;
            font-family: 'Orbitron', monospace;
            color: #010101;
            cursor: pointer;
            box-shadow: 0 0 12px cyan;
        }

        .log-container {
            margin-top: 30px;
            background: #03050cee;
            border-radius: 24px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            overflow: hidden;
        }
        #log {
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: #0ffb9c;
            padding: 16px 18px;
            max-height: 220px;
            min-height: 130px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .footer-note {
            text-align: center;
            font-size: 0.65rem;
            color: #66aaff;
            margin-top: 20px;
            border-top: 1px dashed rgba(0, 255, 255, 0.3);
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="animated-bg">
    <div class="cyber-grid"></div>
    <div class="glowing-orbs">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
        <div class="orb orb4"></div>
    </div>
    <div class="pulse-line"></div>
</div>

<div class="game-card">
    <div class="card-inner">
        <div class="brand-header">
            <div class="icon-badge"><i class="fas fa-gamepad"></i></div>
            <h1>zx boomber proo <span style="background: linear-gradient(125deg,#ff00cc,#00ffff); background-clip:text; -webkit-background-clip:text; color:transparent;">SMS BOMBER</span></h1>
            <div class="sub"><i class="fas fa-bolt"></i> VIP MODE ACTIVE</div>
        </div>

        <div class="input-group">
            <div class="input-label"><i class="fas fa-mobile-alt"></i> <span>টার্গেট নম্বর</span></div>
            <input type="tel" id="phone" placeholder="01xxxxxxxx" autocomplete="off">
        </div>

        <div class="input-group">
            <div class="input-label"><i class="fas fa-bomb"></i> <span>মেসেজ কাউন্ট</span></div>
            <input type="number" id="count" min="1" max="120" value="5">
        </div>

        <button class="btn-send" id="sendBtn" onclick="startSending()">💀 START BLAST 💀</button>

        <div class="log-container">
            <div id="log">[🟢] SYSTEM BOOTING...</div>
        </div>
        <div class="footer-note">CORS প্রোক্সি সক্রিয়</div>
    </div>
</div>

<script>
    let isSendingActive = false;
    async function startSending() {
        if (isSendingActive) return;
        let phone = document.getElementById('phone').value.trim();
        let count = parseInt(document.getElementById('count').value);
        if (!phone) { alert("নম্বর দিন!"); return; }
        
        isSendingActive = true;
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += `\n[🎯] টার্গেট: ${phone} শুরু হচ্ছে...`;
        
        // ... (বাকি লজিক একই থাকবে)
        isSendingActive = false;
    }
</script>

</body>
</html>
